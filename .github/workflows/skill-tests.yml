# Skill健全性チェック（GitHub Actions ワークフロー）
#
# 目的: scripts/ の検査コードや tests/ を更新して push したとき、
#       Skill自体が壊れていないかを自動で確認する。
#       Claudeの「テストは通った」という自己申告に頼らず、
#       GitHubのサーバー側が機械的にテストを実行し、結果を記録する。
#
# いつ動くか:
#   - main ブランチへの push（scripts/ か tests/ が変わったとき）
#   - Pull Request（マージ前に壊れていないか確認）
#   - 手動実行（Actions画面のボタンから）

name: Skill健全性チェック

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/skill-tests.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch:   # 手動実行を許可

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を用意
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 任意依存（Excel検証用）を導入
        # openpyxl が入っていれば Excel関連の1件も検査対象になる。
        # 入っていなくてもテスト本体は動く（その1件はスキップ扱い）。
        run: pip install openpyxl

      - name: 自己テストを実行
        run: python3 tests/run_tests.py
